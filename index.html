<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸勝利國小一年六班🧸</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v8 穩定版) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body {
            /* 可愛點點背景 */
            background-color: #fdf5f7;
            background-image: radial-gradient(#f9a8d4 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        .tab-btn {
            transition: all 0.25s ease;
        }
        .tab-btn.active-contact {
            background-color: #38bdf8;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
        }
        .tab-btn.active-announcement {
            background-color: #fbbf24;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(251, 191, 36, 0.4);
        }
        .tab-btn.active-reminder {
            background-color: #34d399;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(52, 211, 153, 0.4);
        }
        .tab-btn.active-website {
            background-color: #c084fc;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(192, 132, 252, 0.4);
        }
    </style>
</head>
<body class="min-h-screen pb-16 text-emerald-950">

    <!-- 頂部標題與登入區 -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-pink-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-amber-100 flex items-center justify-center text-2xl shadow-inner">🧸</div>
                <div>
                    <h1 class="text-xl font-black text-slate-800 tracking-wide">一年六班 親師聯絡布告欄</h1>
                    <p class="text-xs text-slate-500 font-bold flex items-center gap-2">
                        <span>💬 有任何問題歡迎詢問旻慧老師唷！</span>
                        <span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-[10px] font-bold">🟢 雲端同步中</span>
                    </p>
                </div>
            </div>
            
            <button id="authBtn" onclick="toggleAuthModal()" class="bg-white text-slate-700 hover:bg-slate-50 border-2 border-slate-200 px-4 py-1.5 rounded-2xl text-xs font-bold flex items-center gap-2 shadow-sm transition">
                <i class="fa-solid fa-lock text-amber-500"></i> 教師管理登入
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6">
        <!-- 分頁選單 (圖示完全參考圖片風格) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <button onclick="switchCategory('contact')" id="btn-contact" class="tab-btn active-contact p-3.5 rounded-3xl bg-white text-left flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-sky-50 text-sky-500 flex items-center justify-center text-xl">📖</div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold">每日優先</div>
                        <div class="font-black text-slate-800 text-sm">每日聯絡本</div>
                    </div>
                </div>
                <span class="bg-rose-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-sm">NEW</span>
            </button>

            <button onclick="switchCategory('announcement')" id="btn-announcement" class="tab-btn p-3.5 rounded-3xl bg-white text-left flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-xl">📣</div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold">校園動態</div>
                        <div class="font-black text-slate-800 text-sm">校內公告</div>
                    </div>
                </div>
            </button>

            <button onclick="switchCategory('reminder')" id="btn-reminder" class="tab-btn p-3.5 rounded-3xl bg-white text-left flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center text-xl">💡</div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold">溫馨叮嚀</div>
                        <div class="font-black text-slate-800 text-sm">旻慧老師的小提醒</div>
                    </div>
                </div>
            </button>

            <button onclick="switchCategory('website')" id="btn-website" class="tab-btn p-3.5 rounded-3xl bg-white text-left flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-purple-50 text-purple-500 flex items-center justify-center text-xl">🌐</div>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold">自主學習</div>
                        <div class="font-black text-slate-800 text-sm">學生常用網站</div>
                    </div>
                </div>
                <span class="bg-rose-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-sm">NEW</span>
            </button>
        </div>

        <!-- 區塊1: 每日聯絡本 -->
        <div id="sec-contact" class="tab-content bg-sky-400 rounded-[2.5rem] p-6 text-white shadow-lg mb-8 relative">
            <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl backdrop-blur-sm">📖</div>
                    <div>
                        <h2 class="text-2xl font-black">一年六班 每日聯絡本</h2>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-xs font-bold text-sky-100">📅 日期選擇：</span>
                            <input type="date" id="contactDatePicker" onchange="loadContactByDate(this.value)" class="bg-white/20 text-white font-bold text-xs px-3 py-1 rounded-full border border-white/30 focus:outline-none">
                        </div>
                    </div>
                </div>
                <button onclick="openContactModal()" class="admin-only hidden bg-amber-300 hover:bg-amber-400 text-amber-950 font-black px-4 py-2 rounded-2xl text-xs shadow-md">
                    ✏️ 更新本日聯絡本
                </button>
            </div>

            <div class="bg-white rounded-[2rem] p-6 text-slate-700 space-y-5 shadow-inner">
                <div>
                    <h3 class="font-black text-sky-600 flex items-center gap-2 mb-2 text-base">
                        <i class="fa-solid fa-pencil"></i> 今日功課作業
                    </h3>
                    <div id="homeworkContent" class="font-bold text-slate-700 whitespace-pre-line leading-relaxed pl-4">載入中...</div>
                </div>

                <div id="sec-bring-box">
                    <hr class="border-sky-100 mb-4">
                    <h3 class="font-black text-amber-500 flex items-center gap-2 mb-2 text-base">
                        <i class="fa-solid fa-bag-shopping"></i> 明日需帶物品
                    </h3>
                    <div id="bringContent" class="font-bold text-slate-700 whitespace-pre-line leading-relaxed pl-4">尚無提醒。</div>
                </div>

                <div id="sec-note-box">
                    <hr class="border-sky-100 mb-4">
                    <h3 class="font-black text-emerald-500 flex items-center gap-2 mb-2 text-base">
                        <i class="fa-solid fa-heart"></i> 今日老師叮嚀
                    </h3>
                    <div id="teacherNoteContent" class="font-bold text-slate-700 whitespace-pre-line leading-relaxed pl-4">大家今天表現都很棒！</div>
                </div>
            </div>
        </div>

        <!-- 區塊2: 校內公告 (黃色系可愛外盒) -->
        <div id="sec-announcement" class="tab-content hidden bg-amber-400 rounded-[2.5rem] p-6 text-white shadow-lg mb-8">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl backdrop-blur-sm">📣</div>
                    <div>
                        <h2 class="text-2xl font-black">校內重要公告</h2>
                        <p class="text-xs text-amber-100 font-bold">處室重要通知與校園訊息</p>
                    </div>
                </div>
                <button onclick="openNoticeModal('announcement')" class="admin-only hidden bg-white text-amber-900 font-black px-4 py-2 rounded-2xl text-xs shadow-md hover:bg-amber-50">
                    ➕ 發布新公告
                </button>
            </div>
            <div id="announcementList" class="space-y-4"></div>
        </div>

        <!-- 區塊3: 旻慧老師的小提醒 (還原圖片中鮮明薄荷綠風格) -->
        <div id="sec-reminder" class="tab-content hidden bg-[#52d6a4] rounded-[2.5rem] p-6 text-white shadow-lg mb-8">
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-white/30">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-2xl shadow-sm">💡</div>
                    <div>
                        <h2 class="text-2xl font-black text-slate-800">旻慧老師的小提醒</h2>
                        <p class="text-xs text-emerald-900 font-bold opacity-80">導師的生活叮嚀與即時通知</p>
                    </div>
                </div>
                <button onclick="openNoticeModal('reminder')" class="admin-only hidden bg-white text-emerald-800 font-black px-4 py-2 rounded-2xl text-xs shadow-md hover:bg-emerald-50">
                    ➕ 新增小提醒
                </button>
            </div>
            <div id="reminderList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- 區塊4: 學生常用網站 (紫色系可愛外盒) -->
        <div id="sec-website" class="tab-content hidden bg-purple-400 rounded-[2.5rem] p-6 text-white shadow-lg mb-8">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl backdrop-blur-sm">🌐</div>
                    <div>
                        <h2 class="text-2xl font-black">學生常用學習網站</h2>
                        <p class="text-xs text-purple-100 font-bold">課後學習與自主探索平台</p>
                    </div>
                </div>
                <button onclick="openWebsiteModal()" class="admin-only hidden bg-white text-purple-900 font-black px-4 py-2 rounded-2xl text-xs shadow-md hover:bg-purple-50">
                    ➕ 新增常用網站
                </button>
            </div>
            <div id="websiteList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </main>

    <!-- Modal 1: 教師登入彈窗 -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative border-4 border-amber-100">
            <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-black text-slate-800 mb-4 flex items-center gap-2">🧸 教師管理員登入</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Email 帳號</label>
                    <input type="email" id="loginEmail" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">登入密碼</label>
                    <input type="password" id="loginPassword" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                </div>
                <button onclick="loginTeacher()" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 font-black py-2.5 rounded-xl transition shadow">確認登入</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: 編輯聯絡本彈窗 -->
    <div id="contactModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative border-4 border-sky-100 max-h-[90vh] overflow-y-auto">
            <button onclick="closeContactModal()" class="absolute top-4 right-4 text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-black text-sky-900 mb-4">📝 更新每日聯絡本</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">選擇套用日期</label>
                    <input type="date" id="modalContactDate" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-sky-700 mb-1">今日功課作業</label>
                    <textarea id="modalHomework" rows="3" class="w-full border-2 border-sky-100 rounded-xl p-2 text-sm" placeholder="1. 國語第一課單字"></textarea>
                </div>
                <div class="border-t pt-3">
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-bold text-amber-700">明日帶物品</label>
                        <label class="text-xs text-slate-500"><input type="checkbox" id="showBringCheck" checked> 顯示此區塊</label>
                    </div>
                    <textarea id="modalBring" rows="2" class="w-full border-2 border-amber-100 rounded-xl p-2 text-sm"></textarea>
                </div>
                <div class="border-t pt-3">
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-bold text-emerald-700">今日老師叮嚀</label>
                        <label class="text-xs text-slate-500"><input type="checkbox" id="showNoteCheck" checked> 顯示此區塊</label>
                    </div>
                    <textarea id="modalNote" rows="2" class="w-full border-2 border-emerald-100 rounded-xl p-2 text-sm"></textarea>
                </div>
                <button onclick="saveContact()" class="w-full bg-sky-400 text-white font-black py-2.5 rounded-xl shadow">儲存並同步至雲端</button>
            </div>
        </div>
    </div>

    <!-- Modal 3: 新增/編輯公告與提醒彈窗 (可自訂可愛小圖示) -->
    <div id="noticeModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative border-4 border-emerald-100 max-h-[90vh] overflow-y-auto">
            <button onclick="closeNoticeModal()" class="absolute top-4 right-4 text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 id="noticeModalTitle" class="text-xl font-black text-slate-800 mb-4">📢 發布項目</h3>
            
            <div class="space-y-4">
                <input type="hidden" id="noticeDocId">
                <input type="hidden" id="noticeType">
                
                <div id="deptSelectBox">
                    <label class="block text-xs font-bold text-slate-600 mb-1">發布處室</label>
                    <select id="noticeDept" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm font-bold">
                        <option value="教務處">教務處</option>
                        <option value="學務處">學務處</option>
                        <option value="輔導室">輔導室</option>
                        <option value="總務處">總務處</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">🎨 選擇可愛卡片小圖示 Emoji</label>
                    <select id="noticeIcon" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm font-bold">
                        <option value="👟">👟 服裝</option>
                        <option value="🎒">🎒 物品</option>
                        <option value="🍱">🍱 午餐</option>
                        <option value="📚">📚 閱讀</option>
                        <option value="🈳">🈳 請假</option>
                        <option value="🎉">🎉 校園與班級活動</option>
                        <option value="⚠️">⚠️ 注意事項</option>
                        <option value="📢">📢 宣導事項</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">標題</label>
                    <input type="text" id="noticeTitle" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm font-bold" placeholder="例如：明日穿著體育服">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">詳細內容</label>
                    <textarea id="noticeContent" rows="3" class="w-full border-2 border-slate-100 rounded-xl p-2 text-sm" placeholder="明日星期三有體育課..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">🖼️ 附加圖片網址 (選填)</label>
                    <input type="url" id="noticeImgUrl" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">🔗 附加網址 (選填)</label>
                    <input type="url" id="noticeLinkUrl" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm">
                </div>
                <button onclick="saveNotice()" class="w-full bg-emerald-400 text-white font-black py-2.5 rounded-xl shadow">確認儲存發布</button>
            </div>
        </div>
    </div>

    <!-- Modal 4: 新增/編輯常用網站彈窗 -->
    <div id="websiteModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative border-4 border-purple-100">
            <button onclick="closeWebsiteModal()" class="absolute top-4 right-4 text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 id="webModalTitle" class="text-xl font-black text-purple-900 mb-4">🌐 新增常用網站</h3>
            <div class="space-y-4">
                <input type="hidden" id="webDocId">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">網站名稱</label>
                    <input type="text" id="webName" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">網站網址 (URL)</label>
                    <input type="url" id="webUrl" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">選擇圖示 Emoji</label>
                    <select id="webIcon" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm font-bold">
                        <option value="📺">📺 影音頻道</option>
                        <option value="📚">📚 線上閱讀</option>
                        <option value="🎨">🎨 藝術繪畫</option>
                        <option value="🎮">🎮 互動遊戲</option>
                        <option value="🧠">🧠 益智學習</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">說明文字</label>
                    <input type="text" id="webNote" class="w-full border-2 border-slate-100 rounded-xl px-3 py-2 text-sm">
                </div>
                <button onclick="saveWebsite()" class="w-full bg-purple-500 text-white font-black py-2.5 rounded-xl shadow">儲存網站資訊</button>
            </div>
        </div>
    </div>

    <!-- 腳本邏輯區塊 -->
    <script>
        // Firebase 初始化
        const firebaseConfig = {
            apiKey: "AIzaSyDvKdDqBex0WtxoboU0Ml-VvGVs5eggFFA",
            authDomain: "class106-board.firebaseapp.com",
            projectId: "class106-board",
            storageBucket: "class106-board.firebasestorage.app",
            messagingSenderId: "34565883734",
            appId: "1:34565883734:web:d9b7c31e6c39fb5a95b8f7"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const getTodayStr = () => new Date().toISOString().split('T')[0];
        document.getElementById('contactDatePicker').value = getTodayStr();

        function switchCategory(cat) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.className = 'tab-btn p-3.5 rounded-3xl bg-white text-left flex items-center justify-between shadow-sm');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));

            const targetBtn = document.getElementById(`btn-${cat}`);
            const targetSec = document.getElementById(`sec-${cat}`);

            if (targetBtn) targetBtn.classList.add(`active-${cat}`);
            if (targetSec) targetSec.classList.remove('hidden');
        }

        // Auth 權限管理
        function toggleAuthModal() {
            if (auth.currentUser) {
                if (confirm("確定要登出教師管理身分嗎？")) auth.signOut();
            } else {
                document.getElementById('authModal').classList.toggle('hidden');
            }
        }

        function loginTeacher() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    alert("登入成功！已開啟編輯權限");
                    document.getElementById('authModal').classList.add('hidden');
                })
                .catch(err => alert("登入失敗：" + err.message));
        }

        auth.onAuthStateChanged(user => {
            const authBtn = document.getElementById('authBtn');
            const adminBtns = document.querySelectorAll('.admin-only');
            if (user) {
                authBtn.innerHTML = '<i class="fa-solid fa-right-from-bracket text-rose-500"></i> 登出管理員';
                adminBtns.forEach(b => b.classList.remove('hidden'));
            } else {
                authBtn.innerHTML = '<i class="fa-solid fa-lock text-amber-500"></i> 教師管理登入';
                adminBtns.forEach(b => b.classList.add('hidden'));
            }
        });

        // 每日聯絡本
        function loadContactByDate(dateStr) {
            db.collection('contact_history').doc(dateStr).get().then(doc => {
                if (doc.exists) {
                    renderContactUI(doc.data());
                } else if (dateStr === getTodayStr()) {
                    document.getElementById('homeworkContent').innerText = "今日尚無聯絡本項目。";
                    document.getElementById('sec-bring-box').classList.add('hidden');
                    document.getElementById('sec-note-box').classList.add('hidden');
                } else {
                    document.getElementById('homeworkContent').innerText = "該日無記錄。";
                    document.getElementById('sec-bring-box').classList.add('hidden');
                    document.getElementById('sec-note-box').classList.add('hidden');
                }
            });
        }

        function renderContactUI(data) {
            document.getElementById('homeworkContent').innerText = data.homework || '無作業';
            const bringBox = document.getElementById('sec-bring-box');
            if (data.showBring) {
                bringBox.classList.remove('hidden');
                document.getElementById('bringContent').innerText = data.bring || '無帶物品需求';
            } else {
                bringBox.classList.add('hidden');
            }

            const noteBox = document.getElementById('sec-note-box');
            if (data.showNote) {
                noteBox.classList.remove('hidden');
                document.getElementById('teacherNoteContent').innerText = data.note || '無小叮嚀';
            } else {
                noteBox.classList.add('hidden');
            }
        }

        loadContactByDate(getTodayStr());

        function openContactModal() {
            document.getElementById('modalContactDate').value = document.getElementById('contactDatePicker').value;
            document.getElementById('contactModal').classList.remove('hidden');
        }
        function closeContactModal() { document.getElementById('contactModal').classList.add('hidden'); }

        function saveContact() {
            const dateStr = document.getElementById('modalContactDate').value;
            const data = {
                homework: document.getElementById('modalHomework').value,
                bring: document.getElementById('modalBring').value,
                note: document.getElementById('modalNote').value,
                showBring: document.getElementById('showBringCheck').checked,
                showNote: document.getElementById('showNoteCheck').checked,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('contact_history').doc(dateStr).set(data).then(() => {
                alert("聯絡本已成功更新！");
                closeContactModal();
                document.getElementById('contactDatePicker').value = dateStr;
                loadContactByDate(dateStr);
            });
        }

        // 公告與提醒 (支援圖片風格排版 + 小圖示)
        function openNoticeModal(type, docId = null) {
            document.getElementById('noticeDocId').value = docId || '';
            document.getElementById('noticeType').value = type;
            document.getElementById('deptSelectBox').style.display = type === 'announcement' ? 'block' : 'none';
            
            if (docId) {
                document.getElementById('noticeModalTitle').innerText = '✏️ 編輯卡片項目';
                const collection = type === 'announcement' ? 'announcements' : 'reminders';
                db.collection(collection).doc(docId).get().then(doc => {
                    const d = doc.data();
                    if (type === 'announcement') document.getElementById('noticeDept').value = d.dept || '教務處';
                    document.getElementById('noticeIcon').value = d.icon || '👟';
                    document.getElementById('noticeTitle').value = d.title || '';
                    document.getElementById('noticeContent').value = d.content || '';
                    document.getElementById('noticeImgUrl').value = d.imgUrl || '';
                    document.getElementById('noticeLinkUrl').value = d.linkUrl || '';
                });
            } else {
                document.getElementById('noticeModalTitle').innerText = type === 'announcement' ? '📢 發布校內公告' : '💡 新增老師小提醒';
                document.getElementById('noticeTitle').value = '';
                document.getElementById('noticeContent').value = '';
                document.getElementById('noticeImgUrl').value = '';
                document.getElementById('noticeLinkUrl').value = '';
            }
            document.getElementById('noticeModal').classList.remove('hidden');
        }
        function closeNoticeModal() { document.getElementById('noticeModal').classList.add('hidden'); }

        function saveNotice() {
            const docId = document.getElementById('noticeDocId').value;
            const type = document.getElementById('noticeType').value;
            const collection = type === 'announcement' ? 'announcements' : 'reminders';
            
            const payload = {
                dept: type === 'announcement' ? document.getElementById('noticeDept').value : '老師提醒',
                icon: document.getElementById('noticeIcon').value,
                title: document.getElementById('noticeTitle').value,
                content: document.getElementById('noticeContent').value,
                imgUrl: document.getElementById('noticeImgUrl').value,
                linkUrl: document.getElementById('noticeLinkUrl').value,
                dateStr: getTodayStr(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (docId) {
                db.collection(collection).doc(docId).update(payload).then(() => {
                    alert("更新成功！");
                    closeNoticeModal();
                });
            } else {
                payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                db.collection(collection).add(payload).then(() => {
                    alert("發布成功！");
                    closeNoticeModal();
                });
            }
        }

        function deleteItem(collection, docId) {
            if (confirm("確定要刪除這筆卡片嗎？")) {
                db.collection(collection).doc(docId).delete().then(() => alert("已成功刪除！"));
            }
        }

        // 監聽校內公告
        db.collection('announcements').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            const list = document.getElementById('announcementList');
            if (snapshot.empty) { list.innerHTML = '<p class="text-white/80 text-sm">目前無公告。</p>'; return; }
            let html = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                html += `
                    <div class="bg-white rounded-[2rem] p-5 text-slate-800 shadow-md relative hover:shadow-lg transition">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-2">
                                <span class="text-2xl">${d.icon || '📢'}</span>
                                <span class="bg-amber-100 text-amber-900 font-black text-xs px-3 py-1 rounded-full">${d.dept || '教務處'}</span>
                                <h3 class="font-black text-slate-800 text-lg">${d.title}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="bg-rose-500 text-white text-[10px] font-black px-2.5 py-1 rounded-full shadow-sm">NEW!</span>
                                <div class="admin-only hidden space-x-1">
                                    <button onclick="openNoticeModal('announcement', '${id}')" class="text-xs bg-sky-100 text-sky-700 font-bold px-2 py-1 rounded-lg">✏️</button>
                                    <button onclick="deleteItem('announcements', '${id}')" class="text-xs bg-rose-100 text-rose-700 font-bold px-2 py-1 rounded-lg">🗑️</button>
                                </div>
                            </div>
                        </div>
                        <p class="text-sm text-slate-600 font-bold whitespace-pre-line leading-relaxed mb-4 pl-8">${d.content}</p>
                        ${d.imgUrl ? `<img src="${d.imgUrl}" class="max-h-56 rounded-2xl mb-3 border border-slate-100 object-cover" alt="公告圖片">` : ''}
                        <div class="flex justify-between items-center text-xs text-slate-400 font-bold pt-2 border-t border-slate-100">
                            <span>提醒時間：${d.dateStr || getTodayStr()}</span>
                            ${d.linkUrl ? `<a href="${d.linkUrl}" target="_blank" class="text-sky-600 underline font-bold">🔗 點擊開啟連結</a>` : ''}
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        });

        // 監聽旻慧老師的小提醒 (圖片精緻卡片風格)
        db.collection('reminders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            const list = document.getElementById('reminderList');
            if (snapshot.empty) { list.innerHTML = '<p class="text-white/80 text-sm col-span-2">目前無提醒。</p>'; return; }
            let html = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                html += `
                    <div class="bg-white rounded-[2rem] p-6 text-slate-800 shadow-md flex flex-col justify-between relative hover:shadow-lg transition">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <div class="flex items-center gap-2.5">
                                    <span class="text-2xl">${d.icon || '👟'}</span>
                                    <h3 class="font-black text-slate-800 text-lg tracking-wide">${d.title}</h3>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="bg-rose-500 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full shadow-sm">NEW!</span>
                                    <div class="admin-only hidden space-x-1">
                                        <button onclick="openNoticeModal('reminder', '${id}')" class="text-xs bg-sky-100 text-sky-700 font-bold px-2 py-1 rounded-lg">✏️</button>
                                        <button onclick="deleteItem('reminders', '${id}')" class="text-xs bg-rose-100 text-rose-700 font-bold px-2 py-1 rounded-lg">🗑️</button>
                                    </div>
                                </div>
                            </div>
                            <p class="text-sm font-bold text-slate-600 whitespace-pre-line leading-relaxed mb-4 pl-1">${d.content}</p>
                        </div>
                        <div class="text-right text-xs text-slate-400 font-bold border-t border-slate-100 pt-3">
                            提醒時間：${d.dateStr || getTodayStr()}
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        });

        // 監聽學生常用網站
        function openWebsiteModal(docId = null) {
            document.getElementById('webDocId').value = docId || '';
            if (docId) {
                document.getElementById('webModalTitle').innerText = '✏️ 編輯網站欄位';
                db.collection('websites').doc(docId).get().then(doc => {
                    const d = doc.data();
                    document.getElementById('webName').value = d.name || '';
                    document.getElementById('webUrl').value = d.url || '';
                    document.getElementById('webIcon').value = d.icon || '📺';
                    document.getElementById('webNote').value = d.note || '';
                });
            } else {
                document.getElementById('webModalTitle').innerText = '🌐 新增常用網站';
                document.getElementById('webName').value = '';
                document.getElementById('webUrl').value = '';
                document.getElementById('webNote').value = '';
            }
            document.getElementById('websiteModal').classList.remove('hidden');
        }
        function closeWebsiteModal() { document.getElementById('websiteModal').classList.add('hidden'); }

        function saveWebsite() {
            const docId = document.getElementById('webDocId').value;
            const payload = {
                name: document.getElementById('webName').value,
                url: document.getElementById('webUrl').value,
                icon: document.getElementById('webIcon').value,
                note: document.getElementById('webNote').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (docId) {
                db.collection('websites').doc(docId).update(payload).then(() => {
                    alert("網站更新成功！");
                    closeWebsiteModal();
                });
            } else {
                payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                db.collection('websites').add(payload).then(() => {
                    alert("推薦網站新增成功！");
                    closeWebsiteModal();
                });
            }
        }

        db.collection('websites').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            const list = document.getElementById('websiteList');
            if (snapshot.empty) { list.innerHTML = '<p class="text-white/80 text-sm col-span-2">尚無網站。</p>'; return; }
            let html = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                html += `
                    <div class="bg-white rounded-[2rem] p-4 flex items-center justify-between gap-4 shadow-md hover:shadow-lg transition">
                        <a href="${d.url}" target="_blank" class="flex items-center gap-4 flex-1">
                            <div class="w-12 h-12 rounded-2xl bg-purple-50 flex items-center justify-center text-2xl flex-shrink-0">${d.icon || '🌐'}</div>
                            <div>
                                <div class="font-black text-slate-800 text-sm">${d.name}</div>
                                <div class="text-xs text-slate-400 font-bold mt-0.5">${d.note || '點擊前往網頁'}</div>
                            </div>
                        </a>
                        <div class="admin-only hidden flex flex-col gap-1">
                            <button onclick="openWebsiteModal('${id}')" class="text-[10px] bg-sky-100 text-sky-700 font-bold px-2 py-0.5 rounded-lg">✏️</button>
                            <button onclick="deleteItem('websites', '${id}')" class="text-[10px] bg-rose-100 text-rose-700 font-bold px-2 py-0.5 rounded-lg">🗑️</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        });
    </script>
</body>
</html>
