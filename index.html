<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一年六班 親師聯繫布告欄</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8 穩定版) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body {
            background-color: #f0fdf4;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        .tab-btn.active {
            background-color: #0284c7;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- 頂部標題與登入區 -->
    <header class="bg-white shadow-sm border-b border-emerald-100">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid font-bold text-amber-500 fa-chalkboard-user"></i>
                    一年六班 親師聯繫布告欄
                </h1>
                <p class="text-xs text-gray-500 mt-1 flex items-center gap-2">
                    <span>🧸 有任何問題可以直接詢問Vicky老師唷！</span>
                    <span id="cloudStatus" class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-[10px] font-semibold">
                        🟢 雲端連線中
                    </span>
                </p>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="authBtn" onclick="toggleAuthModal()" class="bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition">
                    <i class="fa-solid fa-lock"></i> 教師管理登入
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6">
        <!-- 分頁分類按鈕 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <button onclick="switchCategory('contact')" id="btn-contact" class="tab-btn active p-4 rounded-2xl bg-white border border-gray-100 text-left transition flex items-center gap-3 shadow-sm hover:border-sky-300">
                <div class="w-10 h-10 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                    <div class="text-[10px] text-gray-400 font-bold">每日優先</div>
                    <div class="font-bold text-gray-700">每日聯絡本</div>
                </div>
            </button>

            <button onclick="switchCategory('announcement')" id="btn-announcement" class="tab-btn p-4 rounded-2xl bg-white border border-gray-100 text-left transition flex items-center gap-3 shadow-sm hover:border-amber-300">
                <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-bullhorn"></i>
                </div>
                <div>
                    <div class="text-[10px] text-gray-400 font-bold">校園動態</div>
                    <div class="font-bold text-gray-700">校內公告</div>
                </div>
            </button>

            <button onclick="switchCategory('reminder')" id="btn-reminder" class="tab-btn p-4 rounded-2xl bg-white border border-gray-100 text-left transition flex items-center gap-3 shadow-sm hover:border-emerald-300">
                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div>
                    <div class="text-[10px] text-gray-400 font-bold">溫馨叮嚀</div>
                    <div class="font-bold text-gray-700">旻慧老師的小提醒</div>
                </div>
            </button>

            <button onclick="switchCategory('website')" id="btn-website" class="tab-btn p-4 rounded-2xl bg-white border border-gray-100 text-left transition flex items-center gap-3 shadow-sm hover:border-indigo-300">
                <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div>
                    <div class="text-[10px] text-gray-400 font-bold">自主學習</div>
                    <div class="font-bold text-gray-700">學生常用網站</div>
                </div>
            </button>
        </div>

        <!-- 區塊1: 每日聯絡本 -->
        <div id="sec-contact" class="tab-content bg-sky-400 rounded-3xl p-6 text-white shadow-lg mb-8">
            <div class="flex justify-between items-center mb-6 flex-wrap gap-2">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🧸</span>
                    <div>
                        <h2 class="text-2xl font-bold">一年六班 每日聯絡本</h2>
                        <span class="bg-sky-500/50 px-3 py-1 rounded-full text-xs font-semibold">旻慧老師的親師園地</span>
                    </div>
                </div>
                <!-- 老師編輯按鈕（登入後顯示） -->
                <button onclick="editContact()" class="admin-only hidden bg-white text-sky-600 hover:bg-sky-50 font-bold px-4 py-2 rounded-xl text-sm transition shadow">
                    <i class="fa-solid fa-pen-to-square"></i> 更新今日聯絡本
                </button>
            </div>

            <div class="bg-white rounded-2xl p-6 text-gray-800 space-y-6 shadow-inner">
                <div>
                    <h3 class="font-bold text-sky-600 flex items-center gap-2 mb-2">
                        <i class="fa-solid fa-book"></i> 今日功課作業
                    </h3>
                    <div id="homeworkContent" class="text-gray-600 min-h-[40px] whitespace-pre-line">尚無今日作業資料。</div>
                </div>
                <hr class="border-gray-100">
                <div>
                    <h3 class="font-bold text-amber-600 flex items-center gap-2 mb-2">
                        <i class="fa-solid fa-bag-shopping"></i> 明日需帶物品
                    </h3>
                    <div id="bringContent" class="text-gray-600 min-h-[40px] whitespace-pre-line">尚無帶物品提醒。</div>
                </div>
                <hr class="border-gray-100">
                <div>
                    <h3 class="font-bold text-emerald-600 flex items-center gap-2 mb-2">
                        <i class="fa-solid fa-comment-dots"></i> 今日老師叮嚀
                    </h3>
                    <div id="teacherNoteContent" class="text-gray-600 min-h-[40px] whitespace-pre-line">大家今天表現都很棒！</div>
                </div>
            </div>
        </div>

        <!-- 區塊2: 校內公告 -->
        <div id="sec-announcement" class="tab-content hidden bg-white rounded-3xl p-6 shadow-md border border-gray-100 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-amber-500"></i> 校內公告
                </h2>
                <button onclick="addNotice('announcement')" class="admin-only hidden bg-amber-500 text-white font-bold px-4 py-2 rounded-xl text-sm hover:bg-amber-600 transition">
                    <i class="fa-solid fa-plus"></i> 新增公告
                </button>
            </div>
            <div id="announcementList" class="space-y-4">
                <p class="text-gray-400 text-sm">載入中...</p>
            </div>
        </div>

        <!-- 區塊3: 旻慧老師的小提醒 -->
        <div id="sec-reminder" class="tab-content hidden bg-white rounded-3xl p-6 shadow-md border border-gray-100 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-heart text-emerald-500"></i> 旻慧老師的小提醒
                </h2>
                <button onclick="addNotice('reminder')" class="admin-only hidden bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-sm hover:bg-emerald-600 transition">
                    <i class="fa-solid fa-plus"></i> 新增提醒
                </button>
            </div>
            <div id="reminderList" class="space-y-4">
                <p class="text-gray-400 text-sm">載入中...</p>
            </div>
        </div>

        <!-- 區塊4: 學生常用網站 -->
        <div id="sec-website" class="tab-content hidden bg-white rounded-3xl p-6 shadow-md border border-gray-100 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-globe text-indigo-500"></i> 學生常用網站
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <a href="https://www.youtube.com" target="_blank" class="p-4 rounded-2xl border border-gray-100 hover:border-indigo-300 hover:shadow-md transition flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-red-100 text-red-500 flex items-center justify-center text-xl font-bold"><i class="fa-brands fa-youtube"></i></div>
                    <div>
                        <div class="font-bold text-gray-800">YouTube 學習頻道</div>
                        <div class="text-xs text-gray-400">課外輔助影音學習</div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <!-- 登入 Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-shield text-rose-500"></i> 教師管理員登入
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">電子郵件 (Email)</label>
                    <input type="email" id="loginEmail" class="w-full border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400" placeholder="your-email@gmail.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">密碼</label>
                    <input type="password" id="loginPassword" class="w-full border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400" placeholder="••••••••">
                </div>
                <button onclick="loginTeacher()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2.5 rounded-xl transition shadow">
                    確認登入
                </button>
            </div>
        </div>
    </div>

    <!-- 程式碼邏輯區塊 -->
    <script>
        // 1. Firebase 專屬設定
        const firebaseConfig = {
            apiKey: "AIzaSyDvKdDqBex0WtxoboU0Ml-VvGVs5eggFFA",
            authDomain: "class106-board.firebaseapp.com",
            projectId: "class106-board",
            storageBucket: "class106-board.firebasestorage.app",
            messagingSenderId: "34565883734",
            appId: "1:34565883734:web:d9b7c31e6c39fb5a95b8f7"
        };

        // 2. 初始化 Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 3. 頁面與選單切換 logic
        function switchCategory(cat) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));

            const targetBtn = document.getElementById(`btn-${cat}`);
            const targetSec = document.getElementById(`sec-${cat}`);

            if (targetBtn) targetBtn.classList.add('active');
            if (targetSec) targetSec.classList.remove('hidden');
        }

        // 4. Auth 控制 (登入與登出 UI)
        function toggleAuthModal() {
            const modal = document.getElementById('authModal');
            if (auth.currentUser) {
                if (confirm("確定要登出教師帳號嗎？")) {
                    auth.signOut();
                }
            } else {
                modal.classList.toggle('hidden');
            }
        }

        function loginTeacher() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    alert("登入成功！");
                    document.getElementById('authModal').classList.add('hidden');
                })
                .catch(err => {
                    alert("登入失敗：" + err.message);
                });
        }

        // 監聽登入狀態切換
        auth.onAuthStateChanged(user => {
            const authBtn = document.getElementById('authBtn');
            const adminButtons = document.querySelectorAll('.admin-only');

            if (user) {
                authBtn.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> 登出管理員';
                adminButtons.forEach(btn => btn.classList.remove('hidden'));
            } else {
                authBtn.innerHTML = '<i class="fa-solid fa-lock"></i> 教師管理登入';
                adminButtons.forEach(btn => btn.classList.add('hidden'));
            }
        });

        // 5. Firestore 資料庫實時讀取
        // 讀取聯絡本
        db.collection('board').doc('contact').onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('homeworkContent').innerText = data.homework || '尚無作業';
                document.getElementById('bringContent').innerText = data.bring || '尚無帶物品提醒';
                document.getElementById('teacherNoteContent').innerText = data.note || '無叮嚀';
            }
        });

        // 讀取校內公告與提醒
        function loadList(collectionName, containerId) {
            db.collection(collectionName).orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                const container = document.getElementById(containerId);
                if (snapshot.empty) {
                    container.innerHTML = '<p class="text-gray-400 text-sm">目前沒有任何項目。</p>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="p-4 rounded-2xl border border-gray-100 hover:shadow-sm transition bg-gray-50/50">
                            <div class="font-bold text-gray-800">${data.title}</div>
                            <div class="text-sm text-gray-600 mt-1 whitespace-pre-line">${data.content}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        loadList('announcements', 'announcementList');
        loadList('reminders', 'reminderList');

        // 6. 老師資料修改功能 (需要登入權限)
        function editContact() {
            const homework = prompt("請輸入今日功課作業：", document.getElementById('homeworkContent').innerText);
            const bring = prompt("請輸入明日需帶物品：", document.getElementById('bringContent').innerText);
            const note = prompt("請輸入今日老師叮嚀：", document.getElementById('teacherNoteContent').innerText);

            if (homework !== null && bring !== null && note !== null) {
                db.collection('board').doc('contact').set({
                    homework: homework,
                    bring: bring,
                    note: note,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert("聯絡本已成功更新至雲端！");
                }).catch(err => alert("更新失敗，請確認權限：" + err.message));
            }
        }

        function addNotice(type) {
            const title = prompt("請輸入標題：");
            if (!title) return;
            const content = prompt("請輸入詳細內容：");
            if (!content) return;

            const collectionName = type === 'announcement' ? 'announcements' : 'reminders';
            db.collection(collectionName).add({
                title: title,
                content: content,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("新增成功！");
            }).catch(err => alert("新增失敗：" + err.message));
        }
    </script>
</body>
</html>
